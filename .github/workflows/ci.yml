name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXTAUTH_SECRET: ci-build-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and smoke test
        run: |
          npm run build
          npm run start &
          npx --yes wait-on@7.2.0 -t 60000 http://127.0.0.1:3000
          npm run qa:smoke
